[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "rmi.dispatch"
description = "A simple and efficient dispatch model."
license = {file = "LICENSE.txt"}
readme = "README.rst"
dynamic = ["version"]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "bottleneck>=1.6.0,<2",
    "numba>=0.65.0,<0.66",
    "numexpr>=2.8,<3",
    "numpy>=1.18.5,<3",
    "pandas>= 1.4,<4",
    "pandera>=0.20.1,<0.31",
    "pyarrow>=7,<25",
]

[project.optional-dependencies]
dev = [
    "coverage>=5.3,<8",  # Lets us track what code is being tested
    "pytest>=6.2,<10",  # test framework
    "datazip",
]
doc = [
    "doc8>=2.0.0,<3",
    "furo>=2025.12.19",
    "rstcheck[sphinx,toml]>=5.0,<7",
    "sphinx>=4,!=5.1.0,<10",
    "sphinx-autoapi>=1.8,<4",
    "sphinx-issues>=1.2,<7",
    "sphinx-autodoc-typehints>1.19,<4",
    "sphinxcontrib-mermaid>0.7,<3",
]
qa = []
tooling = []
tests = []
viz = [
    "plotly>5.10,<7",
    "kaleido>0.2,<2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dispatch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch"]

[tool.hatch.build.targets.sdist]
include = ["src/dispatch", "README.rst", "LICENSE.txt"]

[tool.uv]
constraint-dependencies = ["kaleido!=0.2.1.post1"]
#######################################################################################
# Configurations for linters and other tools
#######################################################################################

[tool.doc8]
max-line-length = 88
ignore-path = "docs/_build"

[tool.coverage]
run.parallel = true
run.branch = true
run.source = [ "dispatch" ]
paths.source = [ "src", ".tox/3*/**/site-packages" ]
report.omit = [ "*/_version.py" ]
report.show_missing = true

[tool.pytest.ini_options]
testpaths = ["."]
addopts = ["--verbose", "--doctest-modules"]
log_format = "%(asctime)s [%(levelname)8s] %(name)s:%(lineno)s %(message)s"
log_date_format=" %Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "INFO"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ELLIPSIS"]
filterwarnings = [
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:Creating a LegacyVersion:DeprecationWarning:pkg_resources[.*]",
]

[tool.rstcheck]
report_level = "WARNING"
ignore_roles = ["pr", "issue", "user", "include"]
ignore_messages = '(Hyperlink target .* is not referenced\.$|Duplicate implicit target name:|An `AttributeError` error occured.*)'
ignore_directives = ["bibliography", "todo", "include"]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint]
select = [  # https://beta.ruff.rs/docs/rules/
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C",
    "C4", # flake8-comprehensions
    "D", # flake8-docstrings
    "E",  # pycodestyle
    "F",  # Pyflakes
    "FBT", # flake8-boolean-trap
    "G", # flake8-logging-format
    "I", # isort
    "TID", # flake8-tidy-imports
    "N", # pep8-naming
    "PD",  # pandas
    "PT", # flake8-pytest-style
    "PGH", # pygrep-hooks
    "S", # bandit
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "UP", # pyupgrade
    "W",  # pycodestyle
    "RUF", # Ruff-specific rules
    "Q", # flake8-quotes
]
ignore = [
    "D105",
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "D401",  # First line of docstring should be in imperative mood: "{first_line}"
    "D407",  # dashed-underline-after-section, upsets Sphinx
    "D416",
    "D417",
    "E501",  # black handles code line length
    # conflict with ruff format
    "W191",  # tab-indentation
    "E111",  # indentation-with-invalid-multiple
    "E114",  # indentation-with-invalid-multiple-comment
    "E117",  # over-indented
    "D206",  # indent-with-spaces
    "D300",  # triple-single-quotes
    "Q000",  # bad-quotes-inline-string
    "Q001",  # bad-quotes-multiline-string
    "Q002",  # bad-quotes-docstring
    "Q003",  # avoidable-escaped-quote
    "COM812",  # missing-trailing-comma
    "COM819",  # prohibited-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
    "ISC002",  # multi-line-implicit-string-concatenation
]
flake8-tidy-imports.ban-relative-imports = "all"
flake8-type-checking.strict = true
mccabe.max-complexity = 15  # Unlike Flake8, default to a complexity level of 10.
pycodestyle.max-doc-length = 88
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs/conf.py" = ["E501"]
"engine.py" = ["E501", "B905", "S101"]
"model.py" = [
    "E501",
    "W505",  # Doc line too long, these are in doctest lines
    # to clean up later
    "PD010",  # `.pivot_table` is preferred to `.pivot` or `.unstack`; provides same functionality
    "PD013",  # `.melt` is preferred to `.stack`; provides same functionality
    "PD901",  # `df` is a bad variable name. Be kinder to your future self.
]
"tests/*.py" = ["S101", "SIM117", "F841", "D101", "PD901", "FBT003"]
"tests/engine_test.py" = ["E501"]

[tool.tox]
env_list = [ "linters", "docs", "prep", "3.13", "3.14", "3.14-pandas2", "coverage" ]

[tool.tox.env.prep]
skip_install = true
deps = "coverage"
commands = [ [ "coverage", "erase" ] ]

[tool.tox.env_run_base]
allowlist_externals = [ "bash", "ruff", "prek" ]
runner = "uv-venv-runner"
extras = [ "dev", "viz" ]
commands = [
    [ "python", "-c", 'import importlib.metadata as m; [print(f"{d.name}=={d.version}") for d in sorted(m.distributions(), key=lambda x: (x.name or "").lower())]' ],
    [ "coverage", "run", "--source={envsitepackagesdir}/dispatch", "-m", "pytest", "--doctest-modules", "{envsitepackagesdir}/dispatch", "tests" ],
]

[tool.tox.env."3.14-pandas2"]
description = "Run tests on Python 3.14 against the pandas <3 line to verify back-compat."
deps = [ "pandas<3.0" ]

[tool.tox.env.coverage]
depends = [ "3.13", "3.14", "3.14-pandas2" ]
skip_install = true
deps = "coverage"
commands = [
    [ "coverage", "combine" ],
    [ "coverage", "report", "--sort=cover" ],
]

[tool.tox.env.linters]
description = "Run the prek, flake8 and bandit linters."
commands = [
    [ "prek", "run", "--all-files", "--show-diff-on-failure", "--skip", "ruff", "--skip", "ruff-format", "--skip", "prettier", "--skip", "doc8", "--skip", "rstcheck" ],
    [ "ruff", "check", "." ],
]

[tool.tox.env.docs]
description = "Build the HTML docs from scratch using Sphinx."
extras = [ "doc" ]
commands = [
    [ "bash", "-c", "rm -rf docs/_build" ],
    [ "doc8", "docs/", "README.rst" ],
    [ "rstcheck", "--config", "pyproject.toml", "--recursive", "./" ],
    [ "sphinx-build", "-b", "html", "docs", "docs/_build/html" ],
]
